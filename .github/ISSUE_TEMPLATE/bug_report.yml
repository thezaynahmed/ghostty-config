name: Bug Report
description: Report an installer, theme-sync, shell icon, or adapter bug
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: OS, Shell & Terminal / IDE
      placeholder: "e.g. macOS 15 / zsh / Ghostty 1.1 + Cursor"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce & output
      description: Paste exact command and error output (redact any secrets).
    validations:
      required: true
