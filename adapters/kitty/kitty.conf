# Kitty Config - Dyslexia + ADHD + Late-Night Edition
font_family      Monaspace Neon
italic_font      Monaspace Radon
bold_italic_font Monaspace Radon
font_size        14.5
font_features    MonaspaceNeon-Regular +calt +ss01 +ss02 +ss03 +zero +cv10

modify_font cell_height 120%
modify_font cell_width 104%
text_composition_strategy 1.7 30

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

background_opacity 1.0
background_blur 0
inactive_text_alpha 0.65
window_padding_width 12 14
scrollback_lines 10000
macos_option_as_alt left

background #282828
foreground #d4be98
cursor #d4be98
cursor_text_color #282828
selection_background #45403d
selection_foreground #d4be98

color0  #282828
color1  #ea6962
color2  #a9b665
color3  #d8a657
color4  #7daea3
color5  #d3869b
color6  #89b482
color7  #d4be98
color8  #7c6f64
color9  #ea6962
color10 #a9b665
color11 #d8a657
color12 #7daea3
color13 #d3869b
color14 #89b482
color15 #ddc7a1
