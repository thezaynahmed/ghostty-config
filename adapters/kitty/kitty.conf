# Kitty Config - Dyslexia + ADHD + Late-Night Edition
font_family      Monaspace Neon
italic_font      Monaspace Radon
bold_italic_font Monaspace Radon
font_size        14.5
font_features    MonaspaceNeon-Regular +calt +ss01 +ss02 +ss03 +zero +cv10

modify_font cell_height 120%
modify_font cell_width 104%
text_composition_strategy 1.7 30

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

background_opacity 1.0
background_blur 0
inactive_text_alpha 0.65
window_padding_width 12 14
scrollback_lines 10000
macos_option_as_alt left

background #15171a
foreground #d8d6cf
cursor #f0c946
cursor_text_color #111316
selection_background #323a46
selection_foreground #eceae4

color0  #15171a
color1  #e86a74
color2  #63c794
color3  #f0c946
color4  #74aeeb
color5  #b695e8
color6  #68c5ce
color7  #d8d6cf
color8  #878d96
color9  #f28b94
color10 #7ed8a9
color11 #f7d96d
color12 #93c2f2
color13 #c8aef0
color14 #84d6de
color15 #eceae4
