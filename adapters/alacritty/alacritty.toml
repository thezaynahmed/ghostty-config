# Alacritty Config - Dyslexia + ADHD + Late-Night Edition
[window]
padding = { x = 14, y = 12 }
dynamic_padding = true
opacity = 1.0
blur = false
option_as_alt = "OnlyLeft"

[scrolling]
history = 10000

[font]
size = 14.5
normal = { family = "Monaspace Neon", style = "Regular" }
bold = { family = "Monaspace Neon", style = "Bold" }
italic = { family = "Monaspace Radon", style = "Regular" }
bold_italic = { family = "Monaspace Radon", style = "Bold" }
offset = { x = 1, y = 3 }

[cursor]
style = { shape = "Block", blinking = "Never" }

[colors.primary]
background = "#15171a"
foreground = "#d8d6cf"

[colors.cursor]
text = "#111316"
cursor = "#f0c946"

[colors.normal]
black   = "#15171a"
red     = "#e86a74"
green   = "#63c794"
yellow  = "#f0c946"
blue    = "#74aeeb"
magenta = "#b695e8"
cyan    = "#68c5ce"
white   = "#d8d6cf"

[colors.bright]
black   = "#878d96"
red     = "#f28b94"
green   = "#7ed8a9"
yellow  = "#f7d96d"
blue    = "#93c2f2"
magenta = "#c8aef0"
cyan    = "#84d6de"
white   = "#eceae4"
