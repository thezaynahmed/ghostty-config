"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 500
format = '$directory$git_branch$git_status$cmd_duration$line_break$status$character'

[directory]
format = '[ $path]($style)[$read_only]($read_only_style) '
style = 'bold blue'
read_only = ' '
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold purple'

[git_status]
style = 'yellow'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'
deleted = '-${count}'

[cmd_duration]
min_time = 2000
format = '[ $duration]($style) '
style = 'yellow'

[status]
disabled = false
format = '[exit:$status]($style) '
style = 'bold red'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'
