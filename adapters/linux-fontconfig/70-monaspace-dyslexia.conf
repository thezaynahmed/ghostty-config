<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Linux Fontconfig - Monaspace Neon & Radon Dyslexia + Anti-Haloing Tuning -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains">
      <string>Monaspace</string>
    </test>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <edit name="fontfeatures" mode="append">
      <string>calt on</string>
      <string>ss01 on</string>
      <string>ss02 on</string>
      <string>ss03 on</string>
      <string>zero on</string>
      <string>cv10 on</string>
    </edit>
  </match>
</fontconfig>
