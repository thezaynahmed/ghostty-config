# tmux Config - Dyslexia + ADHD + Late-Night Edition
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Steady block cursor and focus tracking
set -g focus-events on
set -ga terminal-overrides ',*:Ss=\E[2 q:Se=\E[2 q'

# Dim inactive split panes to lock visual focus onto active pane
setw -g window-style 'fg=#928374,bg=#1d2021'
setw -g window-active-style 'fg=#d4be98,bg=#282828'

# High-contrast pane borders
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#d8a657'
set -g history-limit 10000
